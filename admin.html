<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Environmental Futures Archive</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="main-content" class="site-main" role="main">
    <div class="site-container">
      <div class="text-column">
        <h1>Archive admin</h1>
        <p>Sign in to manage submissions and download the private archive export.</p>
        <form id="admin-form" class="submit-form">
          <div class="form-group">
            <label for="admin-email" class="form-label">Email</label>
            <input id="admin-email" class="form-control" type="email" required>
          </div>
          <div class="form-group">
            <label for="admin-password" class="form-label">Password</label>
            <input id="admin-password" class="form-control" type="password" required>
          </div>
          <p id="admin-error" class="field-error" role="alert"></p>
          <button class="btn btn-primary" type="submit">Sign in</button>
        </form>
        <section id="admin-panel" hidden>
          <p><a id="download-link" class="btn btn-primary" href="#">Download all stories (.zip)</a></p>
          <h2>Submitted stories</h2>
          <div id="admin-stories"></div>
        </section>
      </div>
    </div>
  </main>
  <script>
    const apiBase = window.EFA_API_BASE || "/api";
    const form = document.getElementById("admin-form");
    const error = document.getElementById("admin-error");
    const panel = document.getElementById("admin-panel");
    const stories = document.getElementById("admin-stories");
    const download = document.getElementById("download-link");
    let token = "";

    function showError(message) {
      error.textContent = message;
      error.classList.add("is-active");
    }

    function renderStories(items) {
      stories.innerHTML = "";
      if (!items.length) {
        stories.textContent = "No stories have been submitted.";
        return;
      }
      items.forEach((story) => {
        const row = document.createElement("article");
        row.style.cssText = "border-top: 1px solid var(--color-rule); padding: 1rem 0;";
        const heading = document.createElement("h3");
        heading.textContent = story.title;
        const details = document.createElement("p");
        details.textContent = `${story.author} · ${story.institution}${story.fileName ? ` · ${story.fileName}` : ""}`;
        const remove = document.createElement("button");
        remove.className = "btn btn-secondary";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.addEventListener("click", async () => {
          if (!window.confirm(`Delete “${story.title}”? This cannot be undone.`)) return;
          const result = await fetch(`${apiBase}/admin/stories?id=${encodeURIComponent(story.id)}`, {
            method: "DELETE",
            headers: { "x-admin-token": token }
          });
          if (!result.ok) {
            showError("The story could not be deleted.");
            return;
          }
          row.remove();
        });
        row.append(heading, details, remove);
        stories.appendChild(row);
      });
    }

    async function loadStories() {
      const result = await fetch(`${apiBase}/admin/stories`, { headers: { "x-admin-token": token } });
      if (!result.ok) throw new Error("The submissions could not be loaded.");
      renderStories(await result.json());
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.textContent = "";
      try {
        const result = await fetch(`${apiBase}/admin/login`, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            email: document.getElementById("admin-email").value,
            password: document.getElementById("admin-password").value
          })
        });
        if (!result.ok) {
          const details = await result.json().catch(() => ({}));
          throw new Error(details.error || "Invalid admin credentials.");
        }
        ({ token } = await result.json());
        download.href = `${apiBase}/admin/export`;
        download.addEventListener("click", async (clickEvent) => {
          clickEvent.preventDefault();
          const file = await fetch(download.href, { headers: { "x-admin-token": token } });
          if (!file.ok) throw new Error("The export could not be created.");
          const blob = await file.blob();
          const objectUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = objectUrl;
          link.download = "environmental-futures-stories.zip";
          link.click();
          URL.revokeObjectURL(objectUrl);
        }, { once: true });
        await loadStories();
        panel.hidden = false;
        form.hidden = true;
      } catch (loginError) {
        showError(loginError.message);
      }
    });
  </script>
</body>
</html>
